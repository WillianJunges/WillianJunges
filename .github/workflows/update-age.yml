name: Update age

on:
  schedule:
    - cron: "0 6 12 * *" # every 12th of the month; the birthday (Feb 12) bumps the age
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  update-age:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Compute age and update README
        run: |
          birth=2002-02-12
          y=$(date -u +%Y); md=$(date -u +%m%d)
          age=$(( y - ${birth:0:4} ))
          if [[ "$md" < "${birth:5:2}${birth:8:2}" ]]; then age=$(( age - 1 )); fi
          sed -i -E "s|<!--AGE-->[0-9]+<!--/AGE-->|<!--AGE-->${age}<!--/AGE-->|" README.md
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -am "chore: update age to ${age}"
            git push
          fi

      # GitHub disables scheduled workflows after 60 days without repo activity
      - uses: gautamkrishnar/keepalive-workflow@v2
